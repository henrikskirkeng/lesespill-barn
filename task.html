<!doctype html>
<html lang="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Lesestjerner – Norskspill</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar card">
      <div>
        <h1>🌟 Lesestjerner</h1>
        <p class="subtitle">Norskspill</p>
      </div>
      <button id="resetBtn" class="secondary">Start på nytt</button>
    </header>

    <section class="progress card">
      <h2>Din utvikling</h2>
      <p><strong>Spiller:</strong> <span id="activeUser">Spiller</span></p>
      <div class="stats">
        <p><strong>Stjerner:</strong> <span id="starCount">0</span> ⭐</p>
        <p><strong>Merker:</strong> <span id="badgeCount">0</span> 🏅</p>
      </div>
      <div class="bar-wrap"><div id="progressBar" class="bar"></div></div>
      <p id="badgeShelf" class="badge-shelf"></p>
    </section>

    <main class="game card">
      <h2 id="taskTitle">Oppgave</h2>
      <p id="taskInstruction"></p>
      <div id="taskContent" class="task-content"></div>
      <div id="answerButtons" class="answer-buttons"></div>
      <p id="feedback" class="feedback" aria-live="assertive"></p>
    </main>
  </div>

  <div id="rewardAnimation" class="reward-animation" aria-hidden="true">✨ Bra jobbet! ✨</div>

  <script src="game-data.js"></script>
  <script src="task.js"></script>
</body>
</html>
